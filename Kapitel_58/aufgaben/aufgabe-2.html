<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kapitel 58, Aufgabe 2: Microdata für einen Steckbrief</title>
</head>
<body>
    <h1>Microdata für einen Steckbrief</h1>
    <p>
        Kopiere den Quelltext in den Schema Markup Validator von schema.org: Er erkennt ein Product mit
        name, model und description.
    </p>
    <article itemscope itemtype="https://schema.org/Product">
        <h2 itemprop="name">Rauchmelder</h2>
        <p>Modell <span itemprop="model">RM 2026</span> mit LED-Anzeige</p>
        <p itemprop="description">Der Rauchmelder warnt in der Küche frühzeitig vor Rauch.</p>
    </article>
</body>
</html>
