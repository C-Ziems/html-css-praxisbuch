<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kapitel 35, Aufgabe 2: Formulardaten mit GET</title>
</head>
<body>
    <h1>Formulardaten mit GET</h1>
    <p>
        Schicke das Formular ab und betrachte die Adresszeile. Das Formular übermittelt hier an diese Seite
        selbst; die Adresse endet mit ?begriff=smarte+Lampe.
    </p>
    <form action="aufgabe-2.html" method="get">
        <label for="begriff">Suchbegriff</label>
        <input type="search" id="begriff" name="begriff" value="smarte Lampe">
        <button type="submit">Suchen</button>
    </form>
</body>
</html>
