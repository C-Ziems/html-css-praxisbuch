<body>
    <h1>Bildleiste mit Einrasten</h1>
    <p>
        Scrolle die Leiste waagerecht, etwa mit Umschalt und Mausrad oder auf dem Touchpad. Sie rastet an
        jedem Bild ein. Am Ende der Leiste wird die Scrollbewegung nicht an die Seite weitergegeben.
    </p>
    <div class="bildleiste">
        <img src="bild-1.svg" alt="Bild 1" width="320" height="200">
        <img src="bild-2.svg" alt="Bild 2" width="320" height="200">
        <img src="bild-3.svg" alt="Bild 3" width="320" height="200">

    </div>
