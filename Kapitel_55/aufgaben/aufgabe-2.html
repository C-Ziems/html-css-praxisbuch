<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kapitel 55, Aufgabe 2: [lang="en"] und :lang(en)</title>
    <link rel="stylesheet" href="aufgabe-2.css">
</head>
<body>
    <h1>[lang="en"] und :lang(en)</h1>
    <p>
        Beide span stehen in englischen Absätzen. Die untere Linie (:lang(en)) erscheint an beiden, die
        obere Linie ([lang="en"]) nur am span, das das Attribut selbst trägt.
    </p>
    <p lang="en">Ohne eigenes Attribut: <span>smart meter</span></p>
    <p lang="en">Mit eigenem Attribut: <span lang="en">smart meter</span></p>
</body>
</html>
