<body>
    <h1>Halbtransparente Farbe und opacity</h1>
    <p>
        Vergleiche die Schrift beider Hinweise. Im ersten ist nur der Hintergrund halb durchsichtig, im
        zweiten das ganze Element einschließlich Text.
    </p>
    <p class="halbtransparent">Hintergrund mit rgb(255 255 0 / 0.5)</p>
    <p class="deckkraft">Hintergrund yellow mit opacity: 0.5</p>
